
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry Maguire | Auto-Apply</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-primary)',
              surface: 'var(--bg-secondary)',
              elevated: 'var(--bg-tertiary)',
              content: {
                DEFAULT: 'var(--text-primary)',
                secondary: 'var(--text-secondary)',
              },
              border: 'var(--border-color)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Open Sans is the resume font: the same face is embedded in the server-rendered PDF,
         so the on-screen page wraps exactly like the file. -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary, #FFFFFF);
            color: var(--text-primary, #000000);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        html.dark body {
            --bg-primary: #000000;
            --bg-secondary: #141414;
            --bg-tertiary: #1F1F1F;
            --text-primary: #FFFFFF;
            --text-secondary: #AFAFAF;
            --border-color: #333333;
            --btn-primary-bg: #FFFFFF;
            --btn-primary-text: #000000;
            --btn-primary-hover: #E2E2E2;
            --btn-secondary-bg: #000000;
            --btn-secondary-text: #FFFFFF;
            --btn-secondary-border: #FFFFFF;
            --btn-secondary-hover: #141414;
        }

        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F6F6F6;
            --bg-tertiary: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #545454;
            --border-color: #E2E2E2;
            --btn-primary-bg: #000000;
            --btn-primary-text: #FFFFFF;
            --btn-primary-hover: #333333;
            --btn-secondary-bg: #FFFFFF;
            --btn-secondary-text: #000000;
            --btn-secondary-border: #000000;
            --btn-secondary-hover: #F6F6F6;
        }

        /* Uber Base Button Styles */
        .uber-button-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            padding: 12px 24px;
            font-weight: 500;
            border-radius: 0;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }
        .uber-button-primary:hover {
            background-color: var(--btn-primary-hover);
        }
        .uber-button-primary:disabled {
            background-color: #E2E2E2;
            color: #AFAFAF;
            cursor: not-allowed;
        }
        html.dark .uber-button-primary:disabled {
            background-color: #333333;
            color: #757575;
        }

        .uber-button-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            padding: 12px 24px;
            font-weight: 500;
            border-radius: 0;
            border: 1px solid var(--btn-secondary-border);
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .uber-button-secondary:hover {
            background-color: var(--btn-secondary-hover);
        }

        /* GitHub Style Diff Colors */
        .diff-removed {
            background-color: #ffebe9;
            color: #cf222e;
            text-decoration: line-through;
            padding: 2px 4px;
            display: block;
            border-left: 4px solid #cf222e;
        }
        html.dark .diff-removed {
            background-color: #3D1010;
            color: #FF8585;
            border-left-color: #FF8585;
        }
        .diff-added {
            background-color: #e6ffec;
            color: #1a7f37;
            padding: 2px 4px;
            display: block;
            border-left: 4px solid #1a7f37;
        }
        html.dark .diff-added {
            background-color: #103D10;
            color: #85FF85;
            border-left-color: #85FF85;
        }

        /* Uber Base Card & Input Styles */
        .uber-card {
            border: 1px solid #E2E2E2;
            background-color: #FFFFFF;
        }
        
        html.dark .uber-card {
            border-color: #333333;
            background-color: #141414;
        }
        
        .uber-input {
            border: 1px solid #E2E2E2;
            background-color: #F6F6F6;
            padding: 12px;
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        html.dark .uber-input {
            border-color: #333333;
            background-color: #121212;
            color: #E0E0E0;
        }
        
        .uber-input:focus {
            border-color: #000000;
            background-color: #FFFFFF;
            outline: none;
        }
        
        html.dark .uber-input:focus {
            border-color: #E0E0E0;
            background-color: #1E1E1E;
        }

        /* Resume typography (fonts, headings, lists, links) is NOT defined here. It lives in
           shared/resumeTheme.ts and is injected at runtime as #resume-theme-style, because the
           server-side PDF renderer uses the very same rules. Only editor chrome stays below. */
        .ProseMirror {
            min-height: 100%;
            outline: none;
            max-width: 100%;
        }
        /* Dark mode: the fluid editor needs readable ink; the paper preview is re-forced to black below. */
        html.dark .ProseMirror { color: #E8E8E8; }
        html.dark .ProseMirror a { color: #6BA4FF; }

        /* A4 Page Simulation for Editor/Preview */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            max-width: 100%;
            padding: 20mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        /* Narrow viewports: let the page scale down rather than push horizontal overflow. */
        @media (max-width: 900px) {
            .a4-page { width: 100%; padding: 12mm; }
        }
        
        /* Paper preview always shows as white paper with black ink, even in dark mode,
           so the on-screen view matches the printed/PDF output. */
        html.dark .a4-page,
        html.dark .a4-page .cv-content,
        html.dark .a4-page .ProseMirror,
        html.dark .a4-page .ProseMirror * {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
        html.dark .a4-page .ProseMirror a,
        html.dark .a4-page .cv-content a {
            color: #0563C1 !important;
        }

        @media print {
            body {
                background: white;
            }
            body * {
                visibility: hidden;
            }
            #root {
                margin: 0;
                padding: 0;
            }
            /* Only show the editor content */
            .a4-page, .a4-page * {
                visibility: visible;
            }
            .a4-page {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 20mm !important; /* Force padding on print */
                box-shadow: none;
                border: none;
            }
            @page {
                size: A4;
                margin: 0; /* Important: Let the div handle padding */
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F6F6F6; }
        ::-webkit-scrollbar-thumb { background: #000000; }

        .uber-loader {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "@tiptap/react": "https://esm.sh/@tiptap/react@^2.6.6",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@^2.6.6",
    "@tiptap/extension-underline": "https://esm.sh/@tiptap/extension-underline@^2.6.6",
    "@tiptap/extension-link": "https://esm.sh/@tiptap/extension-link@^2.6.6",
    "@tiptap/extension-text-align": "https://esm.sh/@tiptap/extension-text-align@^2.6.6",
    "mammoth": "https://esm.sh/mammoth@^1.4.8",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.10.38",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^2.3.0",
    "@libsql/client": "https://esm.sh/@libsql/client@0.6.0/web"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
